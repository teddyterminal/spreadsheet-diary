<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico">
    <title>Spreadsheet Records</title>  
</head>

<body>
    <button onclick="undo()">Undo</button>
    <table id="table"></table>

    <script>
        async function load() {
            const res = await fetch("/data");
            const rows = await res.json();
            const table = document.getElementById("table");
            table.innerHTML = "";

            const headers = Object.keys(rows[0]);
            table.insertAdjacentHTML("beforeend",
                "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>");

            rows.forEach((row, i) => {
                const tr = document.createElement("tr");

                headers.forEach(h => {
                    const td = document.createElement("td");
                    td.textContent = row[h];

                    // Add coloring class based on column and value
                    const value = row[h];
                    let cls = null;
                    if (typeof value === 'number' || !isNaN(parseFloat(value))) {
                        const num = parseFloat(value);
                        if (h === '+/-') {
                            if (num >= 5) cls = 'really-good';
                            else if (num >= 1) cls = 'good';
                            else if (num === 0) cls = 'tie';
                            else if (num >= -4) cls = 'bad';
                            else cls = 'really-bad';
                        } else if (h === 'WD') {
                            if (num >= 35) cls = 'really-good';
                            else if (num >= 1) cls = 'good';
                            else if (num === 0) cls = 'tie';
                            else if (num >= -34) cls = 'bad';
                            else cls = 'really-bad';
                        } else if (h === 'MD') {
                            if (num >= 150) cls = 'really-good';
                            else if (num >= 1) cls = 'good';
                            else if (num === 0) cls = 'tie';
                            else if (num >= -149) cls = 'bad';
                            else cls = 'really-bad';
                        } else if (h === 'YD') {
                            if (num > 0) cls = 'good';
                            else if (num < 0) cls = 'bad';
                            else cls = 'tie';
                        } else if (h === 'ENT' || h === 'ENT90') {
                            cls = num < 0.5 ? 'good' : 'bad';
                        } else if (h === 'L30W') {
                            if (num >= 20) cls = 'really-good';
                            else if (num <= 10) cls = 'really-bad';
                            else if (num > 15) cls = 'good';
                            else if (num === 15) cls = 'tie';
                            else cls = 'bad';
                        } else if (h === "STRK" && num >= 10) {
                            cls = 'tie';
                        }
                    } else if (h === 'REC?' && value === "✓") {
                        cls = 'really-good';
                    }
                    if (cls) td.classList.add(cls);

                    if (h === "diff") {
                        td.classList.add("editable");
                        td.contentEditable = true;

                        td.onblur = async () => {
                            await fetch("/edit", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ row: i, diff: parseFloat(td.textContent) })
                            });
                            load();
                        };
                    }

                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });
        }

        async function undo() {
            await fetch("/undo", { method: "POST" });
            load();
        }

        load();
    </script>
</body>

</html>
